<style>

  .bar{height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:20px;}
  .bar-fill{height:100%; background:var(--accent); transition:width .3s ease;}

  .qtext{font-size:17px; font-weight:500; margin-bottom:18px; line-height:1.5;}
  .opt{

  .opt.wrong{background:var(--danger-bg); border-color:var(--danger); color:var(--danger);}

  .explain{margin-top:14px; padding:12px 14px; background:var(--bg); border-radius:6px; font-size:13.5px; color:var(--ink-soft); display:none;}

  .btn{

  .study-num{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin-bottom:4px;}
  .domain-head{

  }
  .domain-head:first-child{margin-top:0; border-top:none; padding-top:0;}

"Passive Eavesdropping", "Session Hijacking"], "c": 2, "e": "การดักฟังแบบ Passive คือการฟัง traffic เครือข่ายโดยไม่แทรกแซงหรือเชื่อมต่อ"}, {"d": "Security Operations", "q": "What is the PRIMARY goal of a business impact analysis (BIA)?", "o": ["Identify and prioritize critical business functions", "Analyze threats against network security", "Determine security control effectiveness", "Perform a penetration test"], "c": 0, "e": "BIA ใช้ระบุกระบวนการทางธุรกิจที่สำคัญและลำดับความสำคัญในการกู้คืน"}, {"d": "Security Operations", "q": "What type of backup method would you use if you want to store only the changes made since the last full backup AND you want fast recovery?", "o": ["Incremental", "Full", "Differential", "Snapshot"], "c": 2, "e": "Differential backup เก็บการเปลี่ยนแปลงตั้งแต่ full backup ครั้งล่าสุด และกู้คืนได้เร็วกว่า incremental"}, {"d": "Security Program Management and Oversight", "q": "Which of the following technologies BEST protects against on-path (Man-in-the-Middle) attacks?", "o": ["VLAN", "IPS", "VPN", "RAID"], "c": 2, "e": "VPN เข้ารหัส traffic ป้องกันการดักฟังและปลอมแปลงข้อมูลใน on-path attack"}, {"d": "Threats, Vulnerabilities, and Mitigations", "q": "During which incident response phase would you isolate a compromised server?", "o": ["Recovery", "Containment", "Lessons Learned", "Identification"], "c": 1, "e": "Containment คือการจำกัดขอบเขตของเหตุการณ์ เช่น การตัดการเชื่อมต่อเซิร์ฟเวอร์ที่ถูกเจาะ"}, {"d": "Security Operations", "q": "What security principle is enforced when employees are required to use two different passwords for administrative and non-administrative accounts?", "o": ["Separation of Duties", "Least Privilege", "Defense in Depth", "Dual Control"], "c": 0, "e": "การแยกรหัสผ่านสำหรับบัญชี admin และบัญชีผู้ใช้ทั่วไป สนับสนุนหลัก Separation of Duties"}, {"d": "Security Operations", "q": "Which cloud model allows the customer the MOST control over the operating system and applications?", "o": ["SaaS", "PaaS", "IaaS", "FaaS"], "c": 2, "e": "ใน IaaS ลูกค้าเป็นผู้บริหารจัดการ OS แอปพลิเคชัน และการตั้งค่าต่างๆ เอง"}, {"d": "Security Operations", "q": "What is a PRIMARY security concern with Infrastructure as Code (IaC)?", "o": ["Outdated server hardware", "Rapid spread of misconfigurations", "Vendor lock-in", "Poor network performance"], "c": 1, "e": "ข้อผิดพลาดใน IaC สามารถแพร่กระจายการตั้งค่าที่ไม่ปลอดภัยไปทั่วระบบได้อย่างรวดเร็ว"}, {"d": "Threats, Vulnerabilities, and Mitigations", "q": "An attacker sends unsolicited Bluetooth messages to nearby devices. What attack is this?", "o": ["Bluesnarfing", "Bluebugging", "Bluejacking", "Bluespoofing"], "c": 2, "e": "Bluejacking คือการส่งข้อความ Bluetooth โดยไม่ได้รับอนุญาตไปยังอุปกรณ์ใกล้เคียง"}, {"d": "Security Architecture", "q": "Which of the following BEST describes a cold site?", "o": ["Operational data center ready for immediate use", "Empty facility with basic infrastructure like power and HVAC", "Fully equipped center with real-time data replication", "Offsite cloud backup provider"], "c": 1, "e": "Cold site มีโครงสร้างพื้นฐานพร้อม แต่ยังต้องติดตั้งอุปกรณ์และข้อมูลก่อนใช้งานได้จริง"}, {"d": "Security Architecture", "q": "Which access control method enforces strict policies based on security labels such as \"Confidential\" or \"Top Secret\"?", "o": ["DAC", "RBAC", "MAC", "ABAC"], "c": 2, "e": "MAC ใช้ป้ายกำกับ เช่น \"Top Secret\" เพื่อควบคุมการเข้าถึงอย่างเข้มงวด"}, {"d": "Security Operations", "q": "An employee plugs a personal USB drive into a company workstation without approval. What risk does this primarily represent?", "o": ["Insider Threat", "Phishing Attack", "Supply Chain Attack", "Business Email Compromise"], "c": 0, "e": "การเสียบอุปกรณ์ที่ไม่ได้รับอนุญาตเข้ากับระบบองค์กร ถือเป็นความเสี่ยงจาก Insider Threat"}, {"d": "General Security Concepts", "q": "Which protocol secures email communication by digitally signing and encrypting messages?", "o": ["TLS", "S/MIME", "SSH", "SSL"], "c": 1, "e": "S/MIME ใช้รักษาความปลอดภัยอีเมลด้วยลายเซ็นดิจิทัลและการเข้ารหัส"}, {"d": "Security Program Management and Oversight", "q": "Which type of control is implementing a security awareness training program?", "o": ["Physical", "Technical", "Preventive", "Administrative"], "c": 3, "e": "โปรแกรมอบรมด้านความปลอดภัยจัดเป็น Administrative Control (เกี่ยวข้องกับนโยบาย/ขั้นตอนปฏิบัติ)"}, {"d": "Threats, Vulnerabilities, and Mitigations", "q": "What is the MOST appropriate tool to use when wanting to aggregate, correlate, and analyze logs from multiple systems?", "o": ["VPN", "Firewall", "SIEM", "NAC"], "c": 2, "e": "SIEM รวบรวมและวิเคราะห์ log จากทั่วทั้งองค์กร"}, {"d": "Security Architecture", "q": "Which of the following would MOST help prevent unauthorized physical access to a data center?", "o": ["IDS", "Biometric Access Controls", "VPN", "Anti-Malware"], "c": 1, "e": "Biometric (เช่น ลายนิ้วมือ) เป็นมาตรการความปลอดภัยทางกายภาพที่มีประสิทธิภาพ"}, {"d": "Security Architecture", "q": "What security concept involves separating services and functions into isolated containers to minimize the attack surface?", "o": ["Microsegmentation", "Defense in Depth", "Least Privilege", "Data Sovereignty"], "c": 0, "e": "Microsegmentation แยก workload ออกจากกันเพื่อลดความเสี่ยงจากการเคลื่อนที่ในแนวขวางของผู้โจมตี"}, {"d": "Threats, Vulnerabilities, and Mitigations", "q": "An attacker successfully tricks a user into giving up login credentials via a fake login page. What attack technique was used?", "o": ["Spear Phishing", "Vishing", "Smishing", "Pharming"], "c": 0, "e": "Spear Phishing มุ่งเป้าไปที่บุคคลเฉพาะ ด้วยหน้าล็อกอินปลอมที่ปรับแต่งมาเฉพาะเจาะจง"}, {"d": "Security Operations", "q": "Which phase of the incident response process involves finding and removing malware from infected systems?", "o": ["Preparation", "Containment", "Eradication", "Lessons Learned"], "c": 2, "e": "Eradication คือขั้นตอนกำจัดมัลแวร์หรือช่องโหว่หลังจากที่ควบคุมสถานการณ์ (containment) แล้ว"}, {"d": "Security Program Management and Oversight", "q": "Which security tool uses signatures and anomaly detection to identify malicious network traffic?", "o": ["Firewall", "SIEM", "IDS", "DLP"], "c": 2, "e": "IDS ตรวจจับภัยคุกคามด้วยการจับคู่ signature หรือหาความผิดปกติ"}, {"d": "Security Operations", "q": "A company wants to ensure that employees can recover their files after a ransomware attack without paying the ransom. Which control BEST achieves this?", "o": ["IDS", "Regular Offline Backups", "VPN Access", "Email Filtering"], "c": 1, "e": "Offline backup ช่วยป้องกัน ransomware โดยมีข้อมูลสำรองที่ปลอดภัยไว้กู้คืน"}, {"d": "General Security Concepts", "q": "Which of the following is MOST critical to maintain when preserving digital evidence?", "o": ["Full Disk Encryption", "Legal Hold", "Chain of Custody", "Incident Triage"], "c": 2, "e": "Chain of Custody รักษาความสมบูรณ์ของหลักฐานเพื่อใช้ทางกฎหมาย"}, {"d": "Threats, Vulnerabilities, and Mitigations", "q": "A company configures a cloud storage bucket and mistakenly leaves it open to the public. What type of vulnerability is this?", "o": ["Zero-Day", "Misconfiguration", "Insider Threat", "Malware Infection"], "c": 1, "e": "การเปิด cloud bucket ให้เข้าถึงสาธารณะโดยไม่ตั้งใจ คือตัวอย่างคลาสสิกของ Misconfiguration"}, {"d": "Security Architecture", "q": "Which layer of the OSI model does a firewall operate primarily at?", "o": ["Application", "Transport", "Network", "Data Link"], "c": 2, "e": "Firewall ทำงานหลักที่ Layer 3 (Network layer) จัดการ IP address และ traffic"}, {"d": "Security Program Management and Oversight", "q": "What security concept is enforced when two employees are required to approve a wire transfer above a certain dollar amount?", "o": ["Dual Control", "Least Privilege", "Discretionary Access Control", "Federation"], "c": 0, "e": "Dual Control กำหนดให้ต้องมีคนสองคนอนุมัติการกระทำที่สำคัญ"}, {"d": "Security Operations", "q": "Which cryptographic concept is used to ensure message integrity?", "o": ["Symmetric Encryption", "Asymmetric Encryption", "Hashing", "Key Exchange"], "c": 2, "e": "Hashing รักษาความถูกต้องของข้อมูล (integrity) ด้วยการสร้างลายนิ้วมือดิจิทัลที่ตายตัว"}, {"d": "Threats, Vulnerabilities, and Mitigations", "q": "What is the purpose of tokenization in data security?", "o": ["Encrypt sensitive data", "Replace sensitive data with non-sensitive placeholders", "Hash sensitive data", "Create a secure communication channel"], "c": 1, "e": "Tokenization แทนที่ข้อมูลจริงด้วย token ปลอมเพื่อปกป้องข้อมูลสำคัญ"}, {"d": "Security Program Management and Oversight", "q": "Which type of backup provides the FASTEST full system recovery after a catastrophic failure?", "o": ["Incremental", "Full Backup", "Differential", "Cloud Backup"], "c": 1, "e": "Full backup ช่วยให้กู้คืนได้เร็วที่สุด เพราะไม่ต้องพึ่งการรวมข้อมูลจากหลาย backup"}, {"d": "Security Operations", "q": "A team uses a sandbox environment to open suspicious files. What type of control is this?", "o": ["Preventive", "Detective", "Corrective", "Compensating"], "c": 0, "e": "Sandbox เป็นมาตรการเชิง preventive แยกไฟล์ต้องสงสัยออกก่อนที่จะสร้างความเสียหาย"}, {"d": "Threats, Vulnerabilities, and Mitigations", "q": "Which of the following is a PRIMARY characteristic of a rootkit?", "o": ["Encrypts files and demands ransom", "Hides its existence by manipulating the OS", "Replicates itself across the network", "Sends unsolicited messages via Bluetooth"], "c": 1, "e": "Rootkit ซ่อนตัวเองโดยการแก้ไขการทำงานของ OS เพื่อหลบเลี่ยงการตรวจจับ"}, {"d": "Security Program Management and Oversight", "q": "An organization wants to minimize data loss during a disaster. Which metric defines the maximum amount of data loss acceptable?", "o": ["RTO", "MTD", "RPO", "ALE"], "c": 2, "e": "RPO (Recovery Point Objective) กำหนดปริมาณข้อมูลสูงสุดที่ยอมรับให้สูญหายได้"}, {"d": "Security Operations", "q": "Which wireless security protocol is considered obsolete and should NOT be used?", "o": ["WPA2", "WPA", "WPA3", "WEP"], "c": 3, "e": "WEP ล้าสมัยและไม่ปลอดภัย สามารถถูกเจาะได้ภายในไม่กี่นาที"}, {"d": "Security Operations", "q": "A system administrator is deploying security patches to all systems automatically after testing. This is an example of:", "o": ["Change Management", "Patch Management", "Hardening", "Incident Response"], "c": 1, "e": "Patch Management คือการวางแผนและติดตั้งอัปเดตอย่างเป็นระบบ"}, {"d": "Security Program Management and Oversight", "q": "What type of malware restricts access to a system until payment is made?", "o": ["Trojan", "Worm", "Spyware", "Ransomware"], "c": 3, "e": "Ransomware เข้ารหัสระบบ/ไฟล์และเรียกค่าไถ่เพื่อแลกกับการเข้าถึง"}, {"d": "Security Architecture", "q": "Which term describes isolating different departments in a network to improve security?", "o": ["Subnetting", "Virtualization", "Network Segmentation", "Packet Filtering"], "c": 2, "e": "Network Segmentation แยกส่วนต่างๆ ของเครือข่ายออกจากกันเพื่อควบคุมและความปลอดภัยที่ดีขึ้น"}, {"d": "Security Program Management and Oversight", "q": "What concept does the principle of \"never trust, always verify\" relate to?", "o": ["VPN", "Zero Trust", "Single Sign-On", "Role-Based Access Control"], "c": 1, "e": "Zero Trust ต้องมีการตรวจสอบยืนยันตัวตนเสมอ ไม่ว่าจะอยู่ตำแหน่งใดในเครือข่าย"}, {"d": "Threats, Vulnerabilities, and Mitigations", "q": "Which tool is specifically designed to discover vulnerabilities in a system but NOT exploit them?", "o": ["Penetration Test", "Exploit Framework", "Vulnerability Scanner", "SIEM"], "c": 2, "e": "Vulnerability Scanner ตรวจหาจุดอ่อนโดยไม่มีการโจมตีจริง"}, {"d": "Threats, Vulnerabilities, and Mitigations", "q": "An employee receives a fake call pretending to be IT support asking for a password. What attack is this?", "o": ["Phishing", "Vishing", "Smishing", "Spear Phishing"], "c": 1, "e": "Vishing คือการฟิชชิงผ่านทางโทรศัพท์"}, {"d": "Security Operations", "q": "A user logs into an internal website using a badge and PIN. What authentication factors are being used?", "o": ["Something you know and something you are", "Something you know and something you have", "Something you have and something you are", "Two instances of something you know"], "c": 1, "e": "PIN = สิ่งที่คุณรู้ (something you know); บัตรพนักงาน = สิ่งที่คุณมี (something you have)"}, {"d": "General Security Concepts", "q": "Which technology allows secure remote access to a corporate network by encrypting all traffic?", "o": ["VLAN", "IDS", "VPN", "Proxy Server"], "c": 2, "e": "VPN เข้ารหัสข้อมูลระหว่างผู้ใช้ระยะไกลกับเครือข่ายองค์กร"}, {"d": "Security Program Management and Oversight", "q": "An employee leaves a confidential document on a shared printer. What kind of risk is this?", "o": ["Insider Threat", "Physical Security Risk", "Supply Chain Risk", "Malware Infection"], "c": 1, "e": "การทิ้งเอกสารลับไว้ในพื้นที่ใช้ร่วมกัน มีความเสี่ยงต่อการเข้าถึงโดยไม่ได้รับอนุญาต"}, {"d": "Security Operations", "q": "Which of the following would MOST effectively prevent malware from executing on endpoints?", "o": ["Application Allowlisting", "IDS Deployment", "SSL/TLS Encryption", "Role-Based Access Control"], "c": 0, "e": "Application Allowlisting อนุญาตให้รันได้เฉพาะแอปที่ได้รับการอนุมัติ ป้องกันมัลแวร์ที่ไม่รู้จัก"}, {"d": "Security Program Management and Oversight", "q": "A company requires that users verify their identity using a username, password, and fingerprint scan. This is an example of:", "o": ["Multi-Factor Authentication", "Federation", "SSO", "Kerberos Authentication"], "c": 0, "e": "การยืนยันตัวตนด้วยปัจจัยที่ต่างประเภทกันตั้งแต่สองอย่างขึ้นไป (รหัสผ่าน + ลายนิ้วมือ)"}, {"d": "Security Program Management and Oversight", "q": "Which security principle ensures that critical functions are divided among multiple people to prevent fraud?", "o": ["Least Privilege", "Separation of Duties", "Job Rotation", "Dual Control"], "c": 1, "e": "ไม่มีบุคคลใดควบคุมกระบวนการสำคัญได้ทั้งหมดเพียงคนเดียว ช่วยป้องกันการทุจริต"}, {"d": "Threats, Vulnerabilities, and Mitigations", "q": "What technique is used by attackers to overload a server with requests, causing service disruption?", "o": ["SQL Injection", "DNS Poisoning", "DDoS Attack", "ARP Spoofing"], "c": 2, "e": "DDoS คือการโจมตีแบบกระจาย ทำให้เซิร์ฟเวอร์ท่วมท้นด้วย traffic จำนวนมาก"}, {"d": "Security Architecture", "q": "Which of the following devices inspects and filters packets based on application-level data?", "o": ["Traditional Firewall", "Proxy Server", "Next-Generation Firewall (NGFW)", "Router"], "c": 2, "e": "NGFW ตรวจสอบแพ็กเก็ตเชิงลึก รวมถึงข้อมูลระดับ application"}, {"d": "General Security Concepts", "q": "Which method ensures that a user cannot deny performing an action, such as sending an email?", "o": ["Non-Repudiation", "Availability", "Encryption", "Role-Based Access Control"], "c": 0, "e": "Non-repudiation ช่วยยืนยันหลักฐานการกระทำ เช่น การส่งอีเมล"}, {"d": "Threats, Vulnerabilities, and Mitigations", "q": "An attacker exploits a race condition in a web application. What is this an example of?", "o": ["Improper Input Handling", "Application Logic Flaw", "Secure Coding Practice", "Race Attack Vulnerability"], "c": 3, "e": "Race condition คือช่องโหว่ที่เกิดจากปัญหาด้านจังหวะเวลาในแอปพลิเคชัน"}, {"d": "Security Architecture", "q": "Which of the following is a benefit of implementing Infrastructure as Code (IaC) securely?", "o": ["Manual configuration of servers", "Consistent and repeatable deployments", "Physical separation of networks", "Encrypted communication tunnels"], "c": 1, "e": "IaC ช่วยให้การตั้งค่าโครงสร้างพื้นฐานเป็นไปอย่างปลอดภัย อัตโนมัติ และสม่ำเสมอ"}, {"d": "Security Operations", "q": "Which of the following BEST describes the primary benefit of implementing a SIEM system?", "o": ["Blocking unauthorized access attempts", "Preventing malware infections", "Aggregating and analyzing security logs centrally", "Encrypting sensitive data at rest"], "c": 2, "e": "ระบบ SIEM รวบรวม log จากหลายแหล่งเพื่อวิเคราะห์แบบรวมศูนย์"}, {"d": "Security Operations", "q": "What is the MAIN purpose of a DLP (Data Loss Prevention) system?", "o": ["Detect malware signatures", "Monitor unauthorized data transfers", "Block phishing emails", "Scan networks for vulnerabilities"], "c": 1, "e": "DLP ป้องกันไม่ให้ข้อมูลสำคัญรั่วไหลออกนอกเครือข่าย"}, {"d": "Security Program Management and Oversight", "q": "An attacker tricks a user into resetting their password by spoofing a legitimate password reset page. What kind of attack is this?", "o": ["Phishing", "SQL Injection", "Session Hijacking", "Privilege Escalation"], "c": 0, "e": "หน้าล็อกอินปลอมที่ใช้หลอกรีเซ็ตรหัสผ่าน คือรูปแบบคลาสสิกของการฟิชชิง"}, {"d": "Security Operations", "q": "Which backup method copies only the files that have changed since the last backup, no matter what type it was?", "o": ["Full", "Incremental", "Differential", "Snapshot"], "c": 1, "e": "Incremental backup เก็บการเปลี่ยนแปลงตั้งแต่ backup ครั้งล่าสุด ไม่ว่าจะเป็น full หรือ incremental ก็ตาม"}, {"d": "Security Program Management and Oversight", "q": "What does the principle of Defense in Depth emphasize?", "o": ["Using multiple layers of security controls", "Deploying only firewalls at the network perimeter", "Using two-factor authentication for all logins", "Relying primarily on SIEM alerts"], "c": 0, "e": "Defense in Depth หมายถึงการไม่มีจุดล้มเหลวเพียงจุดเดียว (no single point of failure)"}, {"d": "Security Program Management and Oversight", "q": "Which of the following is an example of an administrative control?", "o": ["Fire extinguisher in server room", "Firewall rules", "Security awareness policy", "Encryption of data at rest"], "c": 2, "e": "Administrative Control ครอบคลุมนโยบายและขั้นตอนปฏิบัติต่างๆ"}, {"d": "Security Operations", "q": "A SOC analyst notices large outbound traffic to an unknown IP. What is the BEST immediate action?", "o": ["Shut down all network switches", "Disconnect affected systems", "Reboot affected systems", "Call the ISP"], "c": 1, "e": "ควรตัดการเชื่อมต่อทันทีเพื่อป้องกันไม่ให้ข้อมูลรั่วไหลเพิ่มเติม"}, {"d": "Security Program Management and Oversight", "q": "Which term describes unauthorized commands sent from a user's browser to a trusted website?", "o": ["Cross-Site Scripting (XSS)", "SQL Injection", "Command Injection", "Cross-Site Request Forgery (CSRF)"], "c": 3, "e": "CSRF หลอกให้ผู้ใช้กระทำการบางอย่างโดยไม่ตั้งใจผ่านคำสั่งที่ไม่ได้รับอนุญาต"}, {"d": "Security Program Management and Oversight", "q": "Which of the following technologies enables a single identity to access multiple applications across different domains?", "o": ["Multifactor Authentication", "Federation", "VPN", "Zero Trust"], "c": 1, "e": "Federation ช่วยให้ล็อกอินครั้งเดียวแล้วใช้งานได้ข้ามหลายองค์กร/ระบบ"}, {"d": "Security Operations", "q": "What is the FIRST action to take when you detect an active ransomware infection?", "o": ["Pay the ransom", "Disconnect infected systems from the network", "Run antivirus scan", "Contact cloud backup provider"], "c": 1, "e": "ต้องแยกระบบที่ติดเชื้อออกจากเครือข่ายก่อนเป็นอันดับแรก เพื่อหยุดการแพร่กระจายของ ransomware"}, {"d": "General Security Concepts", "q": "Which of the following terms describes preventing unauthorized access by forcing a user to authenticate again after a period of inactivity?", "o": ["Session Lock", "Password Complexity", "Single Sign-On", "Federation"], "c": 0, "e": "Session Lock บังคับให้ยืนยันตัวตนใหม่หลังจากไม่มีการใช้งานช่วงหนึ่ง เพื่อป้องกันการเข้าถึงโดยไม่ได้รับอนุญาต"}, {"d": "Security Program Management and Oversight", "q": "What type of test involves assessing the physical, administrative, and technical safeguards without exploiting vulnerabilities?", "o": ["Vulnerability Scan", "Penetration Test", "Risk Assessment", "Business Impact Analysis"], "c": 2, "e": "Risk Assessment ประเมินมาตรการป้องกันโดยไม่มีการโจมตีช่องโหว่จริง"}, {"d": "General Security Concepts", "q": "Which component is critical for ensuring confidentiality when sending sensitive data across the Internet?", "o": ["Hashing", "Encryption", "Load Balancing", "IDS"], "c": 1, "e": "การเข้ารหัส (Encryption) ปกป้องความลับของข้อมูลระหว่างการส่งผ่าน"}, {"d": "Security Architecture", "q": "What is the purpose of implementing redundant power supplies in servers?", "o": ["Improve encryption performance", "Increase network bandwidth", "Enhance system availability", "Provide faster processing"], "c": 2, "e": "แหล่งจ่ายไฟสำรอง (redundant power supply) ช่วยให้เซิร์ฟเวอร์ทำงานต่อได้แม้ไฟดับ"}, {"d": "Security Program Management and Oversight", "q": "Which of the following MOST accurately defines tokenization?", "o": ["Encrypting all data in a database", "Replacing sensitive data elements with a unique identifier", "Hashing user passwords before storage", "Obfuscating source code to protect intellectual property"], "c": 1, "e": "Tokenization แทนที่ข้อมูลจริงด้วย token ที่ปลอดภัยและไม่มีความหมายในตัวเอง"}, {"d": "Threats, Vulnerabilities, and Mitigations", "q": "An attacker uses a vulnerability in a software program that has not yet been patched. What kind of attack is this?", "o": ["Zero-Day", "Man-in-the-Middle", "Cross-Site Scripting", "Phishing"], "c": 0, "e": "Zero-day คือการโจมตีที่ใช้ประโยชน์จากช่องโหว่ที่ยังไม่มีใครรู้หรือยังไม่ได้แพตช์"}, {"d": "Security Program Management and Oversight", "q": "What is the BEST method to mitigate the impact of social engineering attacks?", "o": ["Install firewalls", "Security Awareness Training", "Regular Penetration Testing", "Conduct Full Backups"], "c": 1, "e": "การอบรมสร้างความตระหนักช่วยให้ผู้ใช้จำแนกและหลีกเลี่ยง social engineering ได้"}, {"d": "Security Operations", "q": "Which type of malware is specifically designed to provide persistent, hidden access to a compromised system?", "o": ["Ransomware", "Trojan", "Rootkit", "Worm"], "c": 2, "e": "Rootkit คงการเข้าถึงระบบแบบซ่อนตัวและถาวรด้วยการฝังตัวลึกในระบบ"}, {"d": "Security Program Management and Oversight", "q": "A backup strategy uses the Grandfather-Father-Son method. What is this primarily designed to achieve?", "o": ["Ensure zero data loss", "Maintain multiple historical versions of backups", "Accelerate disaster recovery", "Improve real-time replication"], "c": 1, "e": "การหมุนเวียนแบบ Grandfather-Father-Son ช่วยรักษาประวัติ backup หลายเวอร์ชันไว้"}, {"d": "General Security Concepts", "q": "What security tool intercepts and controls traffic between a user and the Internet to enforce company policies?", "o": ["Firewall", "VPN", "Proxy Server", "Load Balancer"], "c": 2, "e": "Proxy Server ทำหน้าที่กรอง ควบคุม และบันทึก traffic อินเทอร์เน็ตของผู้ใช้ เพื่อบังคับใช้นโยบายองค์กร"}];

let mode = 'quiz';
let order = [];
let idx = 0;
let score = 0;
let answered = false;

function shuffle(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function startQuiz(){
  order = shuffle(QUESTIONS.length);
  idx = 0; score = 0; answered = false;
  renderQuiz();
}

function renderQuiz(){
  const view = document.getElementById('quizView');
  if(idx >= order.length){
    view.innerHTML = `
      <div class="card scorecard">
        <div class="big">${score} / ${order.length}</div>
        <div class="label">${Math.round(score/order.length*100)}% correct</div>
        <div class="navrow" style="justify-content:center; margin-top:24px;">
          <button class="btn" onclick="startQuiz()">Try again</button>
        </div>
      </div>`;
    return;
  }
  const q = QUESTIONS[order[idx]];
  const pct = Math.round((idx)/order.length*100);
  view.innerHTML = `
    <div class="card">
      <div class="progress-row"><span>Question ${idx+1} of ${order.length}</span><span>Score: ${score}</span></div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="qtext">${q.q}</div>
      <div id="opts"></div>
      <div id="explainBox" class="explain"></div>
      <div class="navrow">
        <span></span>
        <button class="btn" id="nextBtn" disabled onclick="nextQ()">Next</button>
      </div>
    </div>`;
  answered = false;
  const optsDiv = document.getElementById('opts');
  q.o.forEach((opt, i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = ()=> selectOpt(i, q);
    optsDiv.appendChild(b);
  });
}

function selectOpt(i, q){
  if(answered) return;
  answered = true;
  const opts = document.querySelectorAll('#opts .opt');
  opts.forEach((b, bi)=>{
    b.disabled = true;
    if(bi === q.c) b.classList.add('correct');
    else if(bi === i) b.classList.add('wrong');
  });
  if(i === q.c) score++;
  const eb = document.getElementById('explainBox');
  eb.textContent = q.e;
  eb.classList.add('show');
  document.getElementById('nextBtn').disabled = false;
}

function nextQ(){
  idx++;
  renderQuiz();
}

function renderStudy(){
  const view = document.getElementById('studyView');
  let html = '';
  let lastDomain = '';
  QUESTIONS.forEach((q, i)=>{
    if(q.d !== lastDomain){
      html += `<div class="domain-head">${q.d}</div>`;
      lastDomain = q.d;
    }
    html += `
      <div class="study-item">
        <div class="study-num">Q${i+1}</div>
        <div class="study-q">${q.q}</div>
        <div class="study-a">Answer: ${q.o[q.c]}</div>
        <div class="study-e">${q.e}</div>
      </div>`;
  });
  view.innerHTML = `<div class="card">${html}</div>`;
}

document.querySelectorAll('.modebtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.modebtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    document.getElementById('quizView').style.display = mode==='quiz' ? 'block':'none';
    document.getElementById('studyView').style.display = mode==='study' ? 'block':'none';
    if(mode==='study') renderStudy();
  });
});

startQuiz();
</script>

</html>
